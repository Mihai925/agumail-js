name: Publish

# Publishes to npm when a GitHub release is published. Authenticates with npm
# trusted publishing (OIDC), so no npm token is stored in the repo. The trusted
# publisher on npmjs.com must name this exact file: publish.yml.

on:
  release:
    types: [published]

permissions:
  id-token: write # required for npm trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds
      - name: Check release tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      # prepublishOnly runs typecheck, tests and build before the upload.
      # Releases marked as pre-release on GitHub go to the "next" dist-tag, not "latest".
      - run: npm publish ${{ github.event.release.prerelease && '--tag next' || '' }}
